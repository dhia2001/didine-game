<style>

  if(i==2)fl.forEach(w=>{const a=.5+.5*Math.sin(tm*2+w.p);if(a<.3)return;for(let px=-L.o;px<cw;px+=L.tw){x.globalAlpha=a*.9;x.fillStyle=w.c;x.fillRect(px+w.x,w.y,w.w,w.h)}x.globalAlpha=1})});

function tick(ts){requestAnimationFrame(tick);const ap=document.querySelector(".app"),on=ap&&ap.style.display!=="none"&&st==="menu"&&!document.hidden;if(!on){NC.style.display="none";last=ts;return}

<script id="acct">
(()=>{
const KS=["dfc","dfcfg","dfd","dfe","dfk","dfl","dfn","dfo","dfp","dfs","dfw","dfx"],DB="dfacc",$=id=>document.getElementById(id);
const ld=()=>{try{const o=JSON.parse(localStorage.getItem(DB));if(o&&o.p)return o}catch(e){}return{cur:"",p:{}}};
const sv=o=>{try{localStorage.setItem(DB,JSON.stringify(o))}catch(e){}};
const hs=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
const snap=()=>{const d={};KS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)d[k]=v}catch(e){}});return d};
function save(){const a=ld();if(!a.cur||!a.p[a.cur])return;a.p[a.cur].d=snap();a.p[a.cur].t=Date.now();sv(a)}
function apply(d){KS.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});Object.keys(d||{}).forEach(k=>{if(KS.includes(k)&&typeof d[k]=="string")try{localStorage.setItem(k,d[k])}catch(e){}})}
function sw(name){const a=ld();if(a.cur&&a.p[a.cur])save();const b=ld(),p=b.p[name];if(!p)return;apply(p.d);b.cur=name;sv(b);location.reload()}
function el(t,o,k){const e=document.createElement(t);if(o)Object.assign(e,o);(k||[]).forEach(c=>e.append(c));return e}
const box=$("acC"),M=$("acM");
function show(kids){box.innerHTML="";kids.forEach(k=>box.append(k));M.style.display="flex"}
function close(){M.style.display="none"}
function lab(){const a=ld();$("acN").textContent=a.cur||"تسجيل الدخول"}
function nameOk(n){return n.length>=2&&n.length<=14}
function welcome(first){
 const n=el("input",{placeholder:"اسم اللاعب",maxLength:14,autocomplete:"off"}),pn=el("input",{placeholder:"رمز سري من 4 أرقام (اختياري)",maxLength:4,inputMode:"numeric",type:"password"}),er=el("div",{className:"er"});
 const go=el("button",{className:"pr",textContent:"إنشاء الحساب وحفظ تقدمي"});
 go.onclick=()=>{const nm=n.value.trim(),p=pn.value.trim();if(!nameOk(nm)){er.textContent="الاسم من 2 إلى 14 حرفاً";return}if(p&&!/^\d{4}$/.test(p)){er.textContent="الرمز 4 أرقام فقط";return}
  const a=ld();if(a.p[nm]){er.textContent="هذا الاسم مستعمل، اختر اسماً آخر";return}
  if(a.cur&&a.p[a.cur]){save();const b=ld();b.p[nm]={pin:p?hs(p):"",d:{},t:Date.now()};b.cur=nm;sv(b);apply({});location.reload()}
  else{a.p[nm]={pin:p?hs(p):"",d:snap(),t:Date.now()};a.cur=nm;sv(a);lab();close()}};
 const kids=[el("h2",{textContent:first?"أهلاً بك في Didine Fighter":"حساب جديد"}),el("p",{textContent:"أنشئ حساباً ليُحفظ تقدمك (المستوى، العملات، الشخصيات) ولا يضيع."}),n,pn,er,go];
 const ex=ld();
 if(Object.keys(ex.p).length){const b=el("button",{textContent:"لدي حساب — تسجيل الدخول"});b.onclick=()=>login();kids.push(b)}
 const im=el("button",{textContent:"📥 لدي كود حفظ (من هاتف آخر)"});im.onclick=()=>imp();kids.push(im);
 if(first){const sk=el("button",{textContent:"لاحقاً"});sk.onclick=()=>{try{sessionStorage.setItem("dfsk","1")}catch(e){}close()};kids.push(sk)}
 else{const c=el("button",{textContent:"رجوع"});c.onclick=()=>panel();kids.push(c)}
 show(kids)}
function login(){
 const a=ld(),kids=[el("h2",{textContent:"تسجيل الدخول"}),el("p",{textContent:"اختر الحساب"})];
 const er=el("div",{className:"er"});
 Object.keys(a.p).forEach(nm=>{const p=a.p[nm],row=el("div",{className:"pf"},[el("b",{textContent:nm}),el("small",{textContent:p.pin?"🔒":""})]);
  row.onclick=()=>{if(nm===a.cur){close();return}
   if(!p.pin){sw(nm);return}
   const pn=el("input",{placeholder:"الرمز السري",maxLength:4,inputMode:"numeric",type:"password"}),ok=el("button",{className:"pr",textContent:"دخول"}),e2=el("div",{className:"er"});
   ok.onclick=()=>{if(hs(pn.value.trim())===p.pin)sw(nm);else e2.textContent="الرمز غير صحيح"};
   const bk=el("button",{textContent:"رجوع"});bk.onclick=()=>login();
   show([el("h2",{textContent:nm}),pn,e2,ok,bk]);pn.focus()};
  kids.push(row)});
 kids.push(er);const nw=el("button",{textContent:"➕ حساب جديد"});nw.onclick=()=>welcome(false);kids.push(nw);
 const bk=el("button",{textContent:"رجوع"});bk.onclick=()=>{ld().cur?panel():welcome(true)};kids.push(bk);show(kids)}
const enc=()=>{save();const a=ld(),n=a.cur,d=(a.p[n]||{}).d||snap();return"DF1:"+btoa(unescape(encodeURIComponent(JSON.stringify({n,d}))))};
function imp(){
 const t=el("textarea",{placeholder:"الصق كود الحفظ هنا (يبدأ بـ DF1:)"}),er=el("div",{className:"er"}),go=el("button",{className:"pr",textContent:"استيراد"});
 go.onclick=()=>{try{const s=t.value.trim();if(!s.startsWith("DF1:"))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));const nm=String(o.n||"").trim();if(!nameOk(nm)||typeof o.d!="object")throw 0;
  const d={};KS.forEach(k=>{if(typeof o.d[k]=="string")d[k]=o.d[k]});
  const a=ld();if(a.cur&&a.p[a.cur])save();const b=ld();b.p[nm]={pin:(b.p[nm]||{}).pin||"",d,t:Date.now()};sv(b);sw(nm)}catch(e){er.textContent="الكود غير صالح"}};
 const bk=el("button",{textContent:"رجوع"});bk.onclick=()=>{ld().cur?panel():welcome(true)};
 show([el("h2",{textContent:"استيراد كود الحفظ"}),el("p",{textContent:"سيُنشأ الحساب بتقدّمه كاملاً على هذا الجهاز."}),t,er,go,bk])}
function panel(){
 const a=ld(),p=a.p[a.cur];if(!p){welcome(true);return}save();
 const t=new Date(ld().p[a.cur].t||Date.now()),ok=el("div",{className:"ok"});
 const cp=el("button",{textContent:"📋 نسخ كود الحفظ"});
 cp.onclick=()=>{const c=enc(),ta=el("textarea",{value:c,readOnly:true});show([el("h2",{textContent:"كود الحفظ"}),el("p",{textContent:"انسخه واحتفظ به. الصقه في اللعبة على أي هاتف آخر (استيراد) لتكمل تقدّمك."}),ta,(()=>{const b=el("button",{className:"pr",textContent:"نسخ"});b.onclick=()=>{ta.select();try{navigator.clipboard.writeText(c)}catch(e){try{document.execCommand("copy")}catch(e2){}}b.textContent="تم النسخ ✓"};return b})(),(()=>{const b=el("button",{textContent:"رجوع"});b.onclick=()=>panel();return b})()])};
 const im=el("button",{textContent:"📥 استيراد كود"});im.onclick=imp;
 const sw2=el("button",{textContent:"👥 تبديل الحساب"});sw2.onclick=login;
 const nw=el("button",{textContent:"➕ حساب جديد"});nw.onclick=()=>welcome(false);
 const lo=el("button",{className:"dg",textContent:"🚪 تسجيل الخروج"});lo.onclick=()=>{save();const b=ld();b.cur="";sv(b);apply({});location.reload()};
 const cl=el("button",{textContent:"إغلاق"});cl.onclick=close;
 show([el("h2",{textContent:"👤 "+a.cur}),el("p",{textContent:"تقدمك يُحفظ تلقائياً • آخر حفظ: "+t.toLocaleTimeString("ar-DZ",{hour:"2-digit",minute:"2-digit"})}),cp,im,sw2,nw,lo,cl])}
$("acB").onclick=()=>{ld().cur?panel():welcome(true)};
lab();
setInterval(save,4000);addEventListener("pagehide",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
setInterval(()=>{const ap=document.querySelector(".app");$("acB").style.display=ap&&ap.style.display!=="none"&&M.style.display!=="flex"?"flex":"none"},400);
function gate(){const c=$("cin");if(c&&c.isConnected&&getComputedStyle(c).display!=="none"){setTimeout(gate,500);return}if(!ld().cur){let sk=0;try{sk=sessionStorage.getItem("dfsk")}catch(e){}if(!sk)welcome(true)}}
setTimeout(gate,600);
window.__acct={ld,save,sw,enc};
})();
</script>
