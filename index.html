<title>Didine Fighter 2D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;800&display=swap"></noscript>
<style>
:root{--night:#1b1346;--dusk:#5b2a86;--sun:#ff7a2f;--gold:#ffd23f;--ink:#120a2e;--paper:#fff8e7;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Cairo,system-ui,sans-serif;color:var(--paper);background:linear-gradient(180deg,var(--night) 0%,var(--dusk) 55%,var(--sun) 100%);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 16px 0;max-width:520px;margin:auto;position:relative}
.sun{position:absolute;left:50%;top:38%;width:240px;height:240px;margin:-120px;border-radius:50%;background:var(--gold);opacity:.9;z-index:0}
.logo{position:relative;z-index:1;text-align:center;transform:rotate(-3deg);margin-top:6px}
.logo h1{font-family:Lalezar,Cairo,sans-serif;font-weight:400;margin:0;font-size:clamp(44px,15vw,72px);line-height:1;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 8px 0 rgba(0,0,0,.25);direction:ltr}
.logo .two{display:inline-block;background:var(--sun);color:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:0 10px;margin-inline-start:6px;transform:rotate(4deg);-webkit-text-stroke:0;text-shadow:none}
.tag{position:relative;z-index:1;margin:10px 0 0;font-weight:800;font-size:15px;text-align:center;text-shadow:0 2px 0 var(--ink)}
.stage{position:relative;z-index:1;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.stage svg{height:min(100%,300px);width:auto;filter:drop-shadow(0 6px 0 rgba(18,10,46,.45));transition:transform .15s}
.stage svg.hit{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.08) rotate(-3deg)}}
.panel{position:relative;z-index:1;width:100%;background:var(--ink);border:3px solid var(--gold);border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.name{font-family:Lalezar,Cairo,sans-serif;font-size:26px;margin:0 0 4px;color:var(--gold)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:14px;font-weight:600;margin-bottom:10px}
.bar{height:10px;border-radius:6px;background:#3a2d6b;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:6px;transition:width .3s}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.roster button{background:#2a1f5c;border:3px solid transparent;border-radius:12px;padding:4px 2px 2px;color:var(--paper);font:700 12px Cairo,sans-serif;cursor:pointer}
.roster button svg{width:100%;height:54px;display:block}
.roster button[aria-pressed=true]{border-color:var(--gold);background:#43307f}
.roster button:focus-visible,.start:focus-visible{outline:3px solid #fff;outline-offset:2px}
.start{width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--gold);color:var(--ink);font:400 34px Lalezar,Cairo,sans-serif;padding:6px 0 2px;box-shadow:0 6px 0 var(--sun);cursor:pointer;letter-spacing:1px}
.start:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sun)}
.cd{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(18,10,46,.92);font-family:Lalezar,Cairo,sans-serif;font-size:clamp(90px,35vw,200px);color:var(--gold);-webkit-text-stroke:3px var(--ink)}
.cd small{font:600 16px Cairo,sans-serif;-webkit-text-stroke:0;color:var(--paper)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#game{display:none;position:fixed;inset:0;z-index:5;background:var(--ink);flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{width:min(100vw,200vh);aspect-ratio:2/1;display:block;background:#000}
.tb{position:absolute;top:calc(env(safe-area-inset-top,0px) + min(6.5vw,13vh));left:50%;transform:translateX(-50%);direction:ltr;display:flex;gap:8px;z-index:6}
.tb button{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:rgba(18,10,46,.7);font-size:18px;color:#fff}
.pad{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;direction:ltr;pointer-events:none}
.grp{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.pad button{width:66px;height:66px;border-radius:50%;border:3px solid var(--ink);background:rgba(255,210,63,.88);font-size:28px;box-shadow:0 4px 0 var(--sun);touch-action:none}
.pad button.b{width:74px;height:74px;background:rgba(255,122,47,.92)}
.pad button.on{transform:translateY(3px);box-shadow:none}
#ov{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,10,46,.9);text-align:center;padding:20px}
#ov h2{font:400 48px Lalezar,Cairo,sans-serif;color:var(--gold);margin:0;-webkit-text-stroke:2px var(--ink)}
#ov p{margin:0;font-weight:600}
#ob{display:flex;flex-direction:column;gap:10px}
#ov button{min-width:210px;border:3px solid var(--ink);border-radius:12px;background:var(--gold);font:400 26px Lalezar,Cairo,sans-serif;padding:4px 16px 0;box-shadow:0 5px 0 var(--sun);cursor:pointer}
.roster button img{width:100%;height:62px;object-fit:contain;display:block}
.stage img{height:min(100%,300px);width:auto;filter:drop-shadow(0 6px 0 rgba(18,10,46,.45));transition:transform .15s}
.stage img.hit{animation:pop .3s}
@media (max-width:420px){.pad{gap:4px}.grp{gap:6px}.pad button{width:50px;height:50px;font-size:22px}.pad button.b{width:54px;height:54px}}
@media (orientation:portrait){#game::after{content:"🔄 اقلب الهاتف أفقيًا لتجربة أفضل";position:absolute;top:calc(50vw + 40px);font:600 14px Cairo,sans-serif;color:var(--gold)}}
.pad button{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;border:4px solid #0b2a6f;background:radial-gradient(circle at 35% 28%,#7fd0ff,#1a78e8 55%,#0a3fa0);box-shadow:0 5px 0 #071d52,inset 0 3px 6px rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(0,0,0,.4);line-height:1}

#cin .cpre small{font:700 13px Cairo,sans-serif;letter-spacing:5px;color:#b9b0e8}
#cin .cpre b{font-weight:400;font-size:clamp(26px,6vw,44px);color:#ffd23f;letter-spacing:3px}
#cin .cheroes{position:absolute;left:0;right:0;bottom:14vh;top:16vh;display:flex;justify-content:center;align-items:flex-end;gap:2vw;z-index:3;padding:0 4vw}
#cin .ch{flex:0 1 28vh;height:100%;max-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:0;transform:translateY(40px) scale(.9);transition:opacity .25s,transform .45s cubic-bezier(.2,1.5,.4,1)}
#cin .ch.in{opacity:1;transform:none}
#cin .ch .cim{width:100%;flex:1;min-height:0;filter:brightness(0) drop-shadow(0 0 0 #000);transition:filter .35s}
#cin .ch .cim svg,#cin .ch .cim img{width:100%;height:100%;object-fit:contain;display:block}
#cin .ch.lit .cim{filter:none}
#cin .ch.lit{animation:hsh .3s}
@keyframes hsh{30%{transform:translateY(-8px) scale(1.06)}}
#cin .ch i{font-style:normal;font-size:clamp(14px,3.4vw,22px);color:#ffd23f;margin-top:6px;opacity:0;transition:opacity .3s;text-shadow:0 2px 0 #000;white-space:nowrap}
#cin .ch.lit i{opacity:1}
#cin .ch:after{content:"";display:block;width:0;height:3px;background:#ffd23f;margin-top:3px;transition:width .4s}
#cin .ch.lit:after{width:80%}
#cin .cmon{position:absolute;right:-12vw;bottom:13vh;width:46vh;height:62vh;z-index:2;opacity:0;transform:translateX(30%);transition:opacity .8s,transform 1.4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#cin .cmon.in{opacity:1;transform:none;animation:rum .12s linear infinite}
@keyframes rum{0%{translate:0 0}50%{translate:2px -2px}100%{translate:-2px 1px}}
#cin .cmon .cbd{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#1c0a14 0%,#0a0308 70%,transparent 72%);border-radius:48% 48% 30% 30%;filter:drop-shadow(0 0 30px rgba(255,40,40,.55))}
#cin .cmon .e{position:absolute;top:26%;width:13%;height:6%;background:#ff2b2b;border-radius:50%;box-shadow:0 0 22px 8px rgba(255,43,43,.85);transform:rotate(-14deg)}
#cin .cmon .e.r{right:30%;transform:rotate(14deg)}#cin .cmon .e.l{left:30%}
#cin .ctl{position:absolute;left:0;right:0;top:30%;transform:translateY(-50%);text-align:center;z-index:7;font-size:clamp(28px,7vw,60px);letter-spacing:2px;text-shadow:0 4px 0 #000,0 0 30px rgba(255,210,63,.6);opacity:0;color:#ffd23f}
#cin .ctl.on{animation:tl 1.9s both}
@keyframes tl{0%{opacity:0;letter-spacing:22px;transform:translateY(-50%) scale(1.3)}15%{opacity:1;letter-spacing:4px;transform:translateY(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
#cin .clogo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(91,42,134,.9),#0a0620 75%)}
#cin .clogo.on{opacity:1;animation:slam .6s cubic-bezier(.2,1.8,.4,1) both}
@keyframes slam{0%{transform:scale(2.6);opacity:0}60%{opacity:1}100%{transform:none}}
#cin .clogo h1{margin:0;font-weight:400;font-size:clamp(46px,12vw,92px);color:#ffd23f;-webkit-text-stroke:3px #120a2e;paint-order:stroke fill;text-shadow:0 6px 0 #120a2e;line-height:1}
#cin .clogo h2{margin:6px 0 0;font-weight:400;font-size:clamp(30px,8vw,60px);color:#fff8e7;background:#ff7a2f;border:4px solid #120a2e;border-radius:12px;padding:0 16px;transform:rotate(-3deg);text-shadow:0 3px 0 #120a2e;line-height:1.25}
#cin .clogo p{font:800 14px Cairo,sans-serif;letter-spacing:3px;color:#fff8e7;margin:18px 0 0;opacity:0;animation:blk 1.2s 1s infinite}
@keyframes blk{50%{opacity:.9}}
#cin .csp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd23f;z-index:9;pointer-events:none}
#cin .cskp{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;font:700 13px Cairo,sans-serif;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:6px 14px;backdrop-filter:blur(6px)}
#cin.shk{animation:shk .35s}
@keyframes shk{20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,4px)}80%{transform:translate(3px,-2px)}}

<style id="acct-css">
#acB{position:fixed;left:50%;transform:translateX(calc(-100% - 5px));bottom:12px;z-index:60;display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:rgba(20,14,56,.75);border:1px solid rgba(255,255,255,.28);color:#fff;font:700 13px Cairo,sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;direction:rtl}
#acM{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(8,4,24,.88);direction:rtl;font-family:Cairo,sans-serif;color:#fff}
.acC{width:min(430px,94vw);max-height:94vh;overflow:auto;background:linear-gradient(160deg,#2a1f66,#14103a);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.acC h2{margin:0 0 4px;font:800 20px Cairo,sans-serif;color:#ffd23f;text-align:center}
.acC p{margin:4px 0 10px;font-size:13px;opacity:.85;text-align:center;line-height:1.5}
.acC input,.acC textarea{width:100%;box-sizing:border-box;margin:5px 0;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:600 15px Cairo,sans-serif;direction:rtl;outline:none}
.acC textarea{height:70px;direction:ltr;font-size:11px;resize:none}
.acC button{display:block;width:100%;margin:6px 0;padding:11px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:700 14px Cairo,sans-serif;cursor:pointer}
.acC button.pr{background:linear-gradient(180deg,#ffd23f,#ff9a1f);color:#2a1500;border:0;font-size:16px}
.acC button.dg{background:rgba(255,70,70,.18)}
.acC .er{color:#ff8a8a;font-size:13px;text-align:center;min-height:18px}
.acC .ok{color:#8dffb0;font-size:13px;text-align:center;min-height:18px}
.acC .row{display:flex;gap:8px}.acC .row button{margin:6px 0}
.acC .pf{display:flex;align-items:center;gap:8px;padding:9px 12px;margin:5px 0;border-radius:12px;background:rgba(255,255,255,.08);cursor:pointer}
.acC .pf b{flex:1}.acC .pf small{opacity:.65}
@media (orientation:landscape) and (max-height:560px){#acM{align-items:flex-start;padding-top:4px}.acC{width:min(520px,96vw);max-height:96vh;padding:8px 14px}.acC h2{font-size:16px;margin:0}.acC p{font-size:11px;margin:2px 0 4px;line-height:1.3}.acC input,.acC textarea{padding:6px 10px;margin:3px 0;font-size:13px}.acC button{padding:7px;margin:3px 0;font-size:13px}.acC button.pr{font-size:14px}.acC .er,.acC .ok{min-height:12px;font-size:11px}.acC textarea{height:44px}}
.acC .avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}.acC .avs button{width:40px;height:40px;margin:0;padding:0;font-size:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s}.acC .avs button.on{background:linear-gradient(180deg,#ffd23f,#ff9a1f);border-color:#fff;transform:scale(1.15)}.acC .big{width:64px;height:64px;margin:0 auto 4px;border-radius:50%;background:linear-gradient(160deg,#ffd23f,#ff7a2f);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.5);animation:acB 2.4s ease-in-out infinite}@keyframes acB{50%{transform:translateY(-4px)}}.acC .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}.acC .chips i{font-style:normal;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.12);font-size:12px;font-weight:700}.acC .pf .a{font-size:22px}@media (orientation:landscape) and (max-height:560px){.acC .avs button{width:32px;height:32px;font-size:17px}.acC .big{width:44px;height:44px;font-size:24px}.acC .chips{margin:2px 0 4px}}
</style>
